<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <!-- Same look as the jekyll-theme-minimal pages, but without its GitHub links in the sidebar and footer. -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
        <p>
          <a href="{{ '/' | relative_url }}">Aviso de privacidad</a><br>
          <a href="{{ '/eliminar-cuenta' | relative_url }}">Eliminar mi cuenta</a>
        </p>
      </header>
      <section>
        {{ content }}
      </section>
    </div>
  </body>
</html>
